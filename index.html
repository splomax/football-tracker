<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tracker Live</title>
<script>
  // Set the theme before the stylesheets paint (js/theme.js takes over once loaded).
  try {
    const saved = JSON.parse(localStorage.getItem("theme"));
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch {
    document.documentElement.dataset.theme = "dark";
  }
  // The Halloween look, through October (js/season.js). A saved "halloween" (true or false) overrides the date.
  try {
    if (JSON.parse(localStorage.getItem("halloween")) ?? new Date().getMonth() === 9) document.documentElement.dataset.season = "halloween";
  } catch {}
</script>
<meta name="description" content="Follow live college football and NFL games: score, clock, down and distance, and where the ball is.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<!-- Link previews (texts, Slack, social). Preview tags need absolute URLs. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Game Tracker Live">
<meta property="og:description" content="Follow live college football and NFL games: score, clock, down and distance, and where the ball is.">
<meta property="og:url" content="https://gametrackerlive.com/">
<meta property="og:image" content="https://gametrackerlive.com/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/picker.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/corner.css">
<link rel="stylesheet" href="css/mobile.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header>
  <button id="panel-toggle" aria-label="Hide game list" title="Hide game list" aria-expanded="true" aria-controls="picker-body">☰</button>
  <!-- Wordmark: the spinner's football, standing still (click it and it spirals once, js/logo.js), then the name on
       two lines over yard-line hash marks. -->
  <button id="logo" aria-label="Spiral the football" title="Spiral the football"><svg class="football" viewBox="0 0 64 64" aria-hidden="true">
    <clipPath id="football-clip-logo"><path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z"/></clipPath>
    <g transform="rotate(-35 32 32)">
      <path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z" fill="#a0522d" stroke="#5c2d0c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 21 Q8 32 12 43 M52 21 Q56 32 52 43" fill="none" stroke="#fff" stroke-width="3.5"/>
      <g clip-path="url(#football-clip-logo)"><g class="laces">
        <path d="M22 32 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M26 26 V38 M32 26 V38 M38 26 V38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      </g></g>
    </g>
  </svg><svg class="pumpkin" viewBox="0 0 64 64" aria-hidden="true">
    <!-- Halloween: a jack-o'-lantern in place of the football (js/season.js). -->
    <path d="M30 15 C30 9 33 5 38 4 L39 8 C36 9 35 11 35 15 Z" fill="#5b7a2e"/>
    <ellipse cx="20" cy="38" rx="15" ry="20" fill="#e8721c" stroke="#b9500b" stroke-width="1.5"/>
    <ellipse cx="44" cy="38" rx="15" ry="20" fill="#e8721c" stroke="#b9500b" stroke-width="1.5"/>
    <ellipse cx="32" cy="38" rx="13" ry="21" fill="#f58a2a" stroke="#b9500b" stroke-width="1.5"/>
    <clipPath id="pumpkin-clip"><ellipse cx="20" cy="38" rx="15" ry="20"/><ellipse cx="44" cy="38" rx="15" ry="20"/></clipPath>
    <g clip-path="url(#pumpkin-clip)"><g class="face">
      <path d="M17 32 L26 32 L21.5 25 Z M38 32 L47 32 L42.5 25 Z M29.5 39 L34.5 39 L32 34.5 Z" fill="#ffd23f"/>
      <path d="M15 43 Q32 57 49 43 L45 44 L43 47.5 L38.5 45 L35 49.5 L31 45.5 L27 49 L23.5 45 L19.5 46.5 Z" fill="#ffd23f"/>
    </g></g>
  </svg></button>
  <h1><span class="l1">Game</span> <span class="l2">Tracker <span class="live">Live</span></span><span class="hash" aria-hidden="true"></span></h1>
  <span id="updated"></span>
  <button id="view-toggle"></button>
  <button id="theme-toggle"></button>
</header>
<main>
  <aside class="preload">
    <button id="picker-toggle" aria-controls="picker-body"><span aria-hidden="true">☰</span><span>Games</span><span class="count" id="picker-count"></span></button>
    <div id="picker-backdrop"></div>
    <div id="picker-body">
    <div class="list-head">
      <div class="drawer-head">Games<button id="picker-close" aria-label="Close">✕</button></div>
      <div class="tabs">
        <button data-league="cfb">College</button>
        <button data-league="nfl">NFL</button>
      </div>
      <div class="filters">
        <div class="conf-wrap">
          <button id="conf" aria-haspopup="true" aria-expanded="false" aria-controls="conf-menu">All conferences</button>
          <button id="conf-clear" aria-label="Clear conference filter" title="Clear" hidden>✕</button>
          <div id="conf-menu" hidden></div>
        </div>
        <button id="top25" aria-pressed="false">Top 25</button>
      </div>
    </div>
    <div id="list"><svg class="spinner" viewBox="0 0 64 64" role="status" aria-label="Loading games">
      <!-- The favicon's football, with its laces rolling over the top like a spiral pass. -->
      <clipPath id="football-clip-list"><path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z"/></clipPath>
      <g transform="rotate(-35 32 32)">
        <path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z" fill="#a0522d" stroke="#5c2d0c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 21 Q8 32 12 43 M52 21 Q56 32 52 43" fill="none" stroke="#fff" stroke-width="3.5"/>
        <g clip-path="url(#football-clip-list)"><g class="laces">
          <path d="M22 32 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <path d="M26 26 V38 M32 26 V38 M38 26 V38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        </g></g>
      </g>
    </svg></div>
    <div class="drawer-foot"><button id="picker-done">Done</button></div>
    </div>
  </aside>
  <section id="board">
    <svg class="spinner" viewBox="0 0 64 64" role="status" aria-label="Loading games">
      <!-- The favicon's football, with its laces rolling over the top like a spiral pass. -->
      <clipPath id="football-clip-board"><path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z"/></clipPath>
      <g transform="rotate(-35 32 32)">
        <path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z" fill="#a0522d" stroke="#5c2d0c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 21 Q8 32 12 43 M52 21 Q56 32 52 43" fill="none" stroke="#fff" stroke-width="3.5"/>
        <g clip-path="url(#football-clip-board)"><g class="laces">
          <path d="M22 32 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <path d="M26 26 V38 M32 26 V38 M38 26 V38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        </g></g>
      </g>
    </svg>
  </section>
</main>
<figure id="coach" hidden>
  <img src="images/cignetti.png" alt="Indiana head coach Curt Cignetti">
</figure>
<div id="corner">
  <div id="settings-menu" hidden><button id="save-board"><span class="check"></span>Save board as image</button><button id="google-me" aria-pressed="false"><span class="check">✓</span>google me</button><button id="mds-blue" aria-pressed="false"><span class="check">✓</span>MDS</button></div>
  <button id="settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-menu">⚙&#xFE0E;</button>
  <footer id="contact">contact: <a href="mailto:sean@gametrackerlive.com">sean@gametrackerlive.com</a></footer>
</div>
</body>
</html>
