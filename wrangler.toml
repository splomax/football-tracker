# One Worker for the whole site: its static files plus the admin API (worker/handler.js).
# The name is the old admin-only Worker's, kept so its secret (ADMIN_PASSWORD) carries over.
name = "football-tracker-admin"
main = "worker/index.js"
account_id = "4aa7291ca4de2ea285201391ffa589bf"
compatibility_date = "2025-06-01"

# The site answers on its own domain. `custom_domain` creates and maintains the DNS record, which is why the zone has
# to be on this same Cloudflare account. workers.dev stays off: one public address, not two.
workers_dev = false
routes = [
  { pattern = "gametrackerlive.com", custom_domain = true },
  { pattern = "www.gametrackerlive.com", custom_domain = true },
]

# The repo root is the site, minus what .assetsignore leaves out (the Worker's own source, tests, tooling).
# The Worker runs first for every request, so www. redirects and /api/ are handled before any file is served.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# The program that fetches the scores for the admin's pages (worker/scorekeeper.js), in one Durable Object. The free
# plan needs the SQLite-backed kind, though it only keeps its state in memory.
[[durable_objects.bindings]]
name = "SCORES"
class_name = "ScoreKeeper"

# Every minute, nudge the program (worker/index.js scheduled): a deploy can drop its wake-up alarm, and nothing else
# would start the new code for phones waiting on a game.
[triggers]
crons = ["* * * * *"]

# The phones that turned on notifications, and their bells (worker/phones.js). KV, so they survive deploys.
[[kv_namespaces]]
binding = "PUSH"
id = "42cd3d2358094401929c99a2b50aa4f1"

# The deployed version's id (env.VERSION.id). Requests to the program carry it, and a program still running older code
# resets itself (worker/handler.js keeperFetch): pages and phones keep it busy, so it wouldn't restart on its own.
[version_metadata]
binding = "VERSION"

# Cloudflare keeps a record of Durable Object classes: GameHub was deployed briefly for a first try at this, then
# removed, which had to be a migration of its own. Keep every entry, in order.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]

[[migrations]]
tag = "v2"
deleted_classes = ["GameHub"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ScoreKeeper"]

# admin.js is the browser module the Worker hands out, so bundle it as a string.
[[rules]]
type = "Text"
globs = ["**/admin.js"]
fallthrough = false
