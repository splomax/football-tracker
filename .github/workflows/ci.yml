name: ci
# Tests on every push and pull request. On main, once they pass, deploy the site (static files and the admin API, one
# Cloudflare Worker: wrangler.toml). Needs the repo secret CLOUDFLARE_API_TOKEN, a Cloudflare API token from the
# "Edit Cloudflare Workers" template that covers the site's domain.
on:
  push:
  pull_request:
  workflow_dispatch:
# A newer push to the same branch cancels the run still going for an older one, so a quick run of pushes ends in one
# test-and-deploy of the latest, not one per push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners ship Google Chrome, which playwright.config.js uses (channel: "chrome"). A few tests also
      # run in Playwright's WebKit, for Safari-only bugs.
      - run: npx playwright install --with-deps webkit
      - run: npm test
      - run: npm run test:worker
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The action's own default is older and ignores newer wrangler.toml settings (assets.run_worker_first,
          # which the www. redirect depends on); keep this in step with the version used locally.
          wranglerVersion: "4.149.0"
      # Start the program on the new code now, not at the next every-minute nudge (as scripts/deploy.sh does).
      - run: curl -fsS --retry 3 --retry-all-errors --max-time 20 -X POST https://gametrackerlive.com/api/wake || true
